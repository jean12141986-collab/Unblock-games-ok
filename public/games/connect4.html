<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Connect 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .turn-text {
      font-size: 15px;
      font-weight: 700;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }
    .board {
      background: #0369a1;
      padding: 12px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(7, 48px);
      gap: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    .slot {
      width: 48px;
      height: 48px;
      background: #090d16;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .slot:hover {
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }
    .disc-1 {
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .disc-2 {
      background: radial-gradient(circle at 35% 35%, #f43f5e, #be123c);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }
    .win-disc {
      animation: pulse 0.7s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }
    .hint {
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-bar">
      <div class="btn-group">
        <button id="mode1P" class="btn active">1 Player (AI)</button>
        <button id="mode2P" class="btn">2 Players</button>
      </div>
      <div id="turnText" class="turn-text" style="color:#38bdf8;">Your Turn (Cyan)</div>
      <button id="restartBtn" class="btn">Reset</button>
    </div>

    <div id="board" class="board"></div>
  </div>

  <div class="hint">Click any column slot to drop a disc</div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playBeep(freq, dur = 0.05) {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.06, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch(e) {}
    }

    const ROWS = 6;
    const COLS = 7;
    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let turn = 1; // 1 = Cyan, 2 = Magenta (AI or P2)
    let mode = '1P';
    let winner = null;
    let winCells = [];

    const boardEl = document.getElementById('board');
    const turnTextEl = document.getElementById('turnText');

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.col = c;
          const val = grid[r][c];
          if (val === 1) slot.classList.add('disc-1');
          else if (val === 2) slot.classList.add('disc-2');

          if (winCells.some(wc => wc.r === r && wc.c === c)) {
            slot.classList.add('win-disc');
          }

          boardEl.appendChild(slot);
        }
      }

      if (winner) {
        turnTextEl.style.color = winner === 1 ? '#38bdf8' : '#f43f5e';
        turnTextEl.innerText = winner === 1 ? 'Cyan Wins!' : (mode === '1P' ? 'AI Wins!' : 'Red Wins!');
      } else {
        turnTextEl.style.color = turn === 1 ? '#38bdf8' : '#f43f5e';
        turnTextEl.innerText = turn === 1 ? 'Cyan Turn' : (mode === '1P' ? 'AI Thinking...' : 'Red Turn');
      }
    }

    function dropDisc(col) {
      if (winner) return false;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][col] === 0) {
          grid[r][col] = turn;
          playBeep(turn === 1 ? 400 : 320, 0.08);
          const win = checkWin(r, col, turn);
          if (win) {
            winner = turn;
            winCells = win;
            playBeep(700, 0.2);
          } else {
            turn = turn === 1 ? 2 : 1;
          }
          render();
          return true;
        }
      }
      return false;
    }

    function checkWin(r, c, p) {
      const directions = [
        [[0, 1], [0, -1]], // Horizontal
        [[1, 0], [-1, 0]], // Vertical
        [[1, 1], [-1, -1]], // Diag down-right
        [[1, -1], [-1, 1]]  // Diag up-right
      ];

      for (let d of directions) {
        let matching = [{ r, c }];
        for (let [dr, dc] of d) {
          let step = 1;
          while (true) {
            const nr = r + dr * step;
            const nc = c + dc * step;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) {
              matching.push({ r: nr, c: nc });
              step++;
            } else {
              break;
            }
          }
        }
        if (matching.length >= 4) {
          return matching;
        }
      }
      return null;
    }

    function aiMove() {
      if (winner || turn !== 2) return;
      // 1. Check if AI can win in 1 move
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === 0) {
            grid[r][c] = 2;
            if (checkWin(r, c, 2)) {
              grid[r][c] = 0;
              dropDisc(c);
              return;
            }
            grid[r][c] = 0;
            break;
          }
        }
      }
      // 2. Block player if player can win
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === 0) {
            grid[r][c] = 1;
            if (checkWin(r, c, 1)) {
              grid[r][c] = 0;
              dropDisc(c);
              return;
            }
            grid[r][c] = 0;
            break;
          }
        }
      }
      // 3. Prefer center column
      const colPref = [3, 2, 4, 1, 5, 0, 6];
      for (let c of colPref) {
        if (grid[0][c] === 0) {
          dropDisc(c);
          return;
        }
      }
    }

    boardEl.addEventListener('click', e => {
      const slot = e.target.closest('.slot');
      if (!slot || winner) return;
      const col = parseInt(slot.dataset.col);
      if (mode === '1P' && turn === 2) return;

      const success = dropDisc(col);
      if (success && mode === '1P' && !winner && turn === 2) {
        setTimeout(aiMove, 350);
      }
    });

    function reset() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      turn = 1;
      winner = null;
      winCells = [];
      render();
    }

    document.getElementById('restartBtn').onclick = reset;
    document.getElementById('mode1P').onclick = () => {
      mode = '1P';
      document.getElementById('mode1P').classList.add('active');
      document.getElementById('mode2P').classList.remove('active');
      reset();
    };
    document.getElementById('mode2P').onclick = () => {
      mode = '2P';
      document.getElementById('mode2P').classList.add('active');
      document.getElementById('mode1P').classList.remove('active');
      reset();
    };

    reset();
  </script>
</body>
</html>
