<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Snake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      background: #050811;
      border: 2px solid #334155;
      border-radius: 8px;
      display: block;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }
    .hint {
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-bar">
      <div class="stat-badge">Score: <span id="scoreVal" style="color:#22c55e;">0</span></div>
      <button id="resetBtn" class="btn">New Run</button>
      <div class="stat-badge">Best: <span id="bestVal" style="color:#a855f7;">0</span></div>
    </div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
  </div>

  <div class="hint" style="margin-top: 12px;">Controls: [Arrow Keys] or [WASD] to Slither</div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function beep(freq, dur, type='sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.08, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch(e) {}
    }

    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let superFood = null;
    let superFoodTimer = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    let isGameOver = false;
    let lastStepTime = 0;
    let stepInterval = 110;

    bestVal.innerText = best;

    function reset() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      stepInterval = 110;
      isGameOver = false;
      superFood = null;
      scoreVal.innerText = '0';
      spawnFood();
      beep(500, 0.08, 'triangle');
    }

    function spawnFood() {
      while (true) {
        const fx = Math.floor(Math.random() * COUNT);
        const fy = Math.floor(Math.random() * COUNT);
        if (!snake.some(s => s.x === fx && s.y === fy)) {
          food = { x: fx, y: fy };
          break;
        }
      }
      if (Math.random() < 0.25 && !superFood) {
        while (true) {
          const sfx = Math.floor(Math.random() * COUNT);
          const sfy = Math.floor(Math.random() * COUNT);
          if (!snake.some(s => s.x === sfx && s.y === sfy) && !(food.x === sfx && food.y === sfy)) {
            superFood = { x: sfx, y: sfy };
            superFoodTimer = 40;
            break;
          }
        }
      }
    }

    function step() {
      if (isGameOver) return;
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        die();
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        die();
        return;
      }

      snake.unshift(head);

      // Eat standard food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.innerText = score;
        beep(750, 0.08, 'sine');
        if (score > best) {
          best = score;
          bestVal.innerText = best;
          localStorage.setItem('snake_best', best);
        }
        stepInterval = Math.max(65, 110 - Math.floor(score / 50) * 5);
        spawnFood();
      } else if (superFood && head.x === superFood.x && head.y === superFood.y) {
        score += 35;
        scoreVal.innerText = score;
        superFood = null;
        beep(920, 0.12, 'sawtooth');
        if (score > best) {
          best = score;
          bestVal.innerText = best;
          localStorage.setItem('snake_best', best);
        }
      } else {
        snake.pop();
      }

      if (superFood) {
        superFoodTimer--;
        if (superFoodTimer <= 0) superFood = null;
      }
    }

    function die() {
      isGameOver = true;
      beep(150, 0.35, 'sawtooth');
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Super Food (Glowing gold)
      if (superFood) {
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(superFood.x * GRID + GRID / 2, superFood.y * GRID + GRID / 2, GRID / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Snake
      snake.forEach((segment, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2);
          // Eyes
          ctx.fillStyle = '#0f172a';
          const eyeOffX = dir.x !== 0 ? (dir.x > 0 ? 12 : 4) : 7;
          const eyeOffY = dir.y !== 0 ? (dir.y > 0 ? 12 : 4) : 7;
          ctx.fillRect(segment.x * GRID + eyeOffX, segment.y * GRID + eyeOffY, 3, 3);
        } else {
          ctx.fillStyle = idx % 2 === 0 ? '#059669' : '#047857';
          ctx.fillRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2);
        }
      });

      if (isGameOver) {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 14);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Press New Run or Space to retry', canvas.width / 2, canvas.height / 2 + 18);
      }
    }

    function gameLoop(time) {
      if (time - lastStepTime > stepInterval) {
        step();
        lastStepTime = time;
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (isGameOver && (e.key === ' ' || e.key === 'Enter')) {
        reset();
        return;
      }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
      } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
      }
    });

    document.getElementById('resetBtn').onclick = reset;

    reset();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
