<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Breakout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      background: #050811;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="hud">
      <div class="badge">Score: <span id="scoreVal" style="color:#38bdf8;">0</span></div>
      <div class="badge">Lives: <span id="livesVal" style="color:#ef4444;">♥♥♥</span></div>
    </div>
    <canvas id="breakoutCanvas" width="480" height="520"></canvas>
  </div>

  <div class="hint">Controls: Move Mouse or [← / →] to Steer Paddle</div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playTone(freq, dur = 0.05, type = 'sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.06, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch(e) {}
    }

    const canvas = document.getElementById('breakoutCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');

    const PADDLE_W = 84;
    const PADDLE_H = 12;
    const BALL_R = 6;
    const ROWS = 5;
    const COLS = 8;
    const BRICK_H = 16;
    const BRICK_PAD = 6;
    const BRICK_TOP = 50;

    let score = 0;
    let lives = 3;
    let state = 'WAITING'; // 'WAITING' | 'PLAYING' | 'GAMEOVER' | 'VICTORY'
    let paddleX = (canvas.width - PADDLE_W) / 2;
    let ballX = canvas.width / 2;
    let ballY = canvas.height - 40;
    let ballVx = 3.5;
    let ballVy = -3.5;

    let bricks = [];
    const colors = ['#f43f5e', '#f97316', '#eab308', '#10b981', '#06b6d4'];

    function initBricks() {
      bricks = [];
      const brickWidth = (canvas.width - 24 - (COLS - 1) * BRICK_PAD) / COLS;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          bricks.push({
            x: 12 + c * (brickWidth + BRICK_PAD),
            y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
            w: brickWidth,
            h: BRICK_H,
            color: colors[r],
            alive: true,
            pts: (ROWS - r) * 20
          });
        }
      }
    }

    function reset() {
      score = 0;
      lives = 3;
      state = 'WAITING';
      scoreVal.innerText = '0';
      livesVal.innerText = '♥♥♥';
      paddleX = (canvas.width - PADDLE_W) / 2;
      resetBall();
      initBricks();
    }

    function resetBall() {
      ballX = paddleX + PADDLE_W / 2;
      ballY = canvas.height - 35;
      ballVx = (Math.random() > 0.5 ? 3.5 : -3.5);
      ballVy = -4;
    }

    function update() {
      if (state === 'WAITING') {
        ballX = paddleX + PADDLE_W / 2;
        ballY = canvas.height - 35;
        return;
      }
      if (state !== 'PLAYING') return;

      ballX += ballVx;
      ballY += ballVy;

      // Wall bounce
      if (ballX - BALL_R <= 0 || ballX + BALL_R >= canvas.width) {
        ballVx *= -1;
        playTone(300);
      }
      if (ballY - BALL_R <= 0) {
        ballVy *= -1;
        playTone(320);
      }

      // Paddle hit
      if (ballY + BALL_R >= canvas.height - 24 && ballY - BALL_R <= canvas.height - 12 &&
          ballX >= paddleX && ballX <= paddleX + PADDLE_W && ballVy > 0) {
        ballVy = -Math.abs(ballVy);
        const hitOffset = (ballX - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
        ballVx = hitOffset * 5.2;
        playTone(450);
      }

      // Brick hit
      let aliveCount = 0;
      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        if (!b.alive) continue;
        aliveCount++;

        if (ballX + BALL_R > b.x && ballX - BALL_R < b.x + b.w &&
            ballY + BALL_R > b.y && ballY - BALL_R < b.y + b.h) {
          b.alive = false;
          ballVy *= -1;
          score += b.pts;
          scoreVal.innerText = score;
          playTone(600 + b.pts * 4, 0.06);
          break;
        }
      }

      if (aliveCount === 0) {
        state = 'VICTORY';
        playTone(900, 0.2);
      }

      // Ball fell out
      if (ballY - BALL_R > canvas.height) {
        lives--;
        livesVal.innerText = '♥'.repeat(Math.max(0, lives));
        playTone(180, 0.2, 'sawtooth');
        if (lives <= 0) {
          state = 'GAMEOVER';
        } else {
          state = 'WAITING';
          resetBall();
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(b.x, b.y, b.w, 2);
      });

      // Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(paddleX, canvas.height - 24, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fill();

      if (state === 'WAITING') {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Click or Press Space to Launch', canvas.width / 2, canvas.height / 2 + 30);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Click to Retry', canvas.width / 2, canvas.height / 2 + 18);
      } else if (state === 'VICTORY') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BOARD CLEARED!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Final Score: ' + score + ' · Click to Play Again', canvas.width / 2, canvas.height / 2 + 18);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      paddleX = Math.max(0, Math.min(canvas.width - PADDLE_W, mx - PADDLE_W / 2));
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') paddleX = Math.max(0, paddleX - 20);
      if (e.key === 'ArrowRight') paddleX = Math.min(canvas.width - PADDLE_W, paddleX + 20);
      if (e.key === ' ' && state === 'WAITING') {
        state = 'PLAYING';
      }
      if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    });

    canvas.addEventListener('click', () => {
      if (state === 'WAITING') state = 'PLAYING';
      else if (state === 'GAMEOVER' || state === 'VICTORY') reset();
    });

    reset();
    loop();
  </script>
</body>
</html>
