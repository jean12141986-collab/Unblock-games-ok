<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      background: #050811;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="hud">
      <div class="badge">Score: <span id="scoreVal" style="color:#38bdf8;">00000</span></div>
      <div class="badge">HI: <span id="hiVal" style="color:#a855f7;">00000</span></div>
    </div>
    <canvas id="runnerCanvas" width="560" height="260"></canvas>
  </div>

  <div class="hint">Controls: [Space] or [↑] to Jump · [↓] to Duck</div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function beep(freq, dur = 0.05, type = 'sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.06, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch(e) {}
    }

    const canvas = document.getElementById('runnerCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const hiVal = document.getElementById('hiVal');

    const GROUND_Y = canvas.height - 40;

    let score = 0;
    let hi = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    let state = 'WAITING'; // 'WAITING' | 'PLAYING' | 'GAMEOVER'
    let speed = 6;
    let frame = 0;

    hiVal.innerText = String(hi).padStart(5, '0');

    const dino = {
      x: 50,
      y: GROUND_Y - 36,
      w: 24,
      h: 36,
      vy: 0,
      gravity: 0.65,
      jumpForce: -11,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let groundOffset = 0;

    function reset() {
      score = 0;
      speed = 6;
      frame = 0;
      obstacles = [];
      dino.y = GROUND_Y - 36;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      dino.h = 36;
      state = 'PLAYING';
      beep(550, 0.06);
    }

    function jump() {
      if (state === 'WAITING' || state === 'GAMEOVER') {
        reset();
      } else if (state === 'PLAYING' && dino.isGrounded) {
        dino.vy = dino.jumpForce;
        dino.isGrounded = false;
        beep(400, 0.08, 'triangle');
      }
    }

    function duck(isDucking) {
      if (state !== 'PLAYING') return;
      dino.isDucking = isDucking;
      if (isDucking) {
        dino.h = 22;
        if (dino.isGrounded) dino.y = GROUND_Y - 22;
      } else {
        dino.h = 36;
        if (dino.isGrounded) dino.y = GROUND_Y - 36;
      }
    }

    function spawnObstacle() {
      const isBird = Math.random() < 0.3 && score > 200;
      if (isBird) {
        const heights = [GROUND_Y - 30, GROUND_Y - 50];
        const by = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          type: 'BIRD',
          x: canvas.width,
          y: by,
          w: 28,
          h: 18
        });
      } else {
        const count = Math.random() < 0.4 ? 2 : 1;
        obstacles.push({
          type: 'CACTUS',
          x: canvas.width,
          y: GROUND_Y - 34,
          w: count === 1 ? 16 : 30,
          h: 34
        });
      }
    }

    function update() {
      if (state !== 'PLAYING') return;

      frame++;
      score += 0.15;
      speed = 6 + Math.floor(score / 150) * 0.6;
      groundOffset = (groundOffset + speed) % 20;

      const currentScoreInt = Math.floor(score);
      scoreVal.innerText = String(currentScoreInt).padStart(5, '0');

      if (currentScoreInt > hi) {
        hi = currentScoreInt;
        hiVal.innerText = String(hi).padStart(5, '0');
        localStorage.setItem('dino_hi', hi);
      }

      // Milestone chime every 100 points
      if (currentScoreInt > 0 && currentScoreInt % 100 === 0 && frame % 10 === 0) {
        beep(800, 0.1, 'square');
      }

      // Dino physics
      if (!dino.isGrounded) {
        dino.vy += dino.gravity;
        dino.y += dino.vy;
        if (dino.y >= GROUND_Y - dino.h) {
          dino.y = GROUND_Y - dino.h;
          dino.vy = 0;
          dino.isGrounded = true;
        }
      }

      // Obstacle management
      if (obstacles.length === 0 || (canvas.width - obstacles[obstacles.length - 1].x > 180 + Math.random() * 220)) {
        if (Math.random() < 0.05) spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= speed;

        // Collision check
        const hitX = dino.x + dino.w - 4 > ob.x && dino.x + 4 < ob.x + ob.w;
        const hitY = dino.y + dino.h - 4 > ob.y && dino.y + 4 < ob.y + ob.h;

        if (hitX && hitY) {
          state = 'GAMEOVER';
          beep(140, 0.35, 'sawtooth');
          return;
        }

        if (ob.x + ob.w < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground line with dash texture
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      for (let x = -groundOffset; x < canvas.width; x += 16) {
        if ((x + frame) % 32 === 0) {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(x, GROUND_Y + 4, 8, 2);
        }
      }

      // Dino
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
      // Eye
      ctx.fillStyle = '#050811';
      ctx.fillRect(dino.x + dino.w - 6, dino.y + 4, 3, 3);

      // Obstacles
      obstacles.forEach(ob => {
        if (ob.type === 'CACTUS') {
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          // Spikes
          ctx.fillRect(ob.x - 3, ob.y + 8, 4, 4);
          ctx.fillRect(ob.x + ob.w - 1, ob.y + 12, 4, 4);
        } else {
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
          // Wings
          const wingY = (frame % 16 < 8) ? ob.y - 6 : ob.y + ob.h;
          ctx.fillRect(ob.x + 8, wingY, 10, 4);
        }
      });

      if (state === 'WAITING') {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Press Space or Up Arrow to Run', canvas.width / 2, canvas.height / 2 - 10);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('RUN OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 18);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ' || e.key === 'ArrowUp') jump();
      if (e.key === 'ArrowDown') duck(true);
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowDown') duck(false);
    });

    canvas.addEventListener('click', jump);

    loop();
  </script>
</body>
</html>
