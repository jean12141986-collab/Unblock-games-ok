<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Flappy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      background: #050811;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="hud">
      <div class="badge">Score: <span id="scoreVal" style="color:#38bdf8;">0</span></div>
      <div class="badge">Best: <span id="bestVal" style="color:#a855f7;">0</span></div>
    </div>
    <canvas id="gameCanvas" width="380" height="520"></canvas>
  </div>

  <div class="hint">Press [Space] or Tap / Click to Fly</div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playTone(freq, dur, type='sine') {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.08, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch(e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');

    let state = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    bestVal.innerText = best;

    const bird = {
      x: 70,
      y: 240,
      radius: 12,
      velocity: 0,
      gravity: 0.35,
      jump: -6.5
    };

    let pipes = [];
    let particles = [];
    let frame = 0;
    const PIPE_GAP = 135;
    const PIPE_WIDTH = 52;
    const PIPE_SPEED = 2.4;

    function resetGame() {
      bird.y = 240;
      bird.velocity = 0;
      pipes = [];
      particles = [];
      score = 0;
      scoreVal.innerText = '0';
      frame = 0;
      state = 'PLAYING';
    }

    function flap() {
      if (state === 'START' || state === 'GAMEOVER') {
        resetGame();
        playTone(550, 0.08, 'triangle');
      } else if (state === 'PLAYING') {
        bird.velocity = bird.jump;
        playTone(480, 0.05, 'triangle');
        // Add thruster particles
        for (let i = 0; i < 4; i++) {
          particles.push({
            x: bird.x - 10,
            y: bird.y + (Math.random() * 8 - 4),
            vx: -2 - Math.random() * 2,
            vy: (Math.random() - 0.5) * 2,
            life: 1,
            color: '#38bdf8'
          });
        }
      }
    }

    function addPipe() {
      const minHeight = 50;
      const maxHeight = canvas.height - PIPE_GAP - minHeight;
      const topHeight = Math.floor(Math.random() * (maxHeight - minHeight)) + minHeight;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - PIPE_GAP,
        passed: false
      });
    }

    function update() {
      frame++;

      if (state === 'PLAYING') {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Ground / ceiling
        if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
          triggerGameOver();
        }

        if (frame % 95 === 0) {
          addPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          // Score check
          if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            score++;
            scoreVal.innerText = score;
            playTone(880, 0.1, 'sine');
            if (score > best) {
              best = score;
              bestVal.innerText = best;
              localStorage.setItem('flappy_best', best);
            }
          }

          // Collision
          const inX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH;
          const inTop = bird.y - bird.radius < p.top;
          const inBottom = bird.y + bird.radius > canvas.height - p.bottom;
          if (inX && (inTop || inBottom)) {
            triggerGameOver();
          }

          if (p.x + PIPE_WIDTH < 0) {
            pipes.splice(i, 1);
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function triggerGameOver() {
      state = 'GAMEOVER';
      playTone(160, 0.3, 'sawtooth');
      // Death explosion particles
      for (let i = 0; i < 24; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
          x: bird.x,
          y: bird.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          color: Math.random() > 0.5 ? '#ef4444' : '#f59e0b'
        });
      }
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      const gridOffset = (frame * 0.8) % 30;
      for (let x = -gridOffset; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);

        // Pipe lip top
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);
        ctx.strokeRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);

        // Bottom pipe
        const bY = canvas.height - p.bottom;
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, bY, PIPE_WIDTH, p.bottom);
        ctx.strokeRect(p.x, bY, PIPE_WIDTH, p.bottom);

        // Pipe lip bottom
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, bY, PIPE_WIDTH + 6, 16);
        ctx.strokeRect(p.x - 3, bY, PIPE_WIDTH + 6, 16);
      });

      // Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });

      // Draw Bird (Drone style)
      if (state !== 'GAMEOVER') {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        const rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 0.08)));
        ctx.rotate(rot);

        // Body glow
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#06b6d4';
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
        ctx.fill();

        // Eye / Visor
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(2, -4, 6, 5);

        // Wing
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.ellipse(-4, 2, 6, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // UI Overlays
      if (state === 'START') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CYBER FLAPPY', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '14px sans-serif';
        ctx.fillText('Press Space or Click to Start', canvas.width / 2, canvas.height / 2 + 10);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 8, 17, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '16px sans-serif';
        ctx.fillText('Score: ' + score + '  |  Best: ' + best, canvas.width / 2, canvas.height / 2 + 6);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Press Space or Click to Retry', canvas.width / 2, canvas.height / 2 + 38);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      flap();
    }, { passive: false });

    loop();
  </script>
</body>
</html>
